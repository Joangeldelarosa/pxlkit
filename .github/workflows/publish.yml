name: Publish to npm

on:
  push:
    branches: [main]
    tags:
      - "v*"
  release:
    types: [published]

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  # ── Gate: build + test + validate before publishing ──────────────
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Type check
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Validate icons
        run: node validate-icons.js

  # ── Publish: only runs after quality-gate passes ─────────────────
  # The npm environment records each run as a GitHub deployment, so the
  # repository's Deployments list shows when packages last went out.
  publish:
    needs: quality-gate
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@pxlkit/ui-kit
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      # ── Detect version changes and publish ──────────────────────
      - name: Detect changed packages and publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Dependencies first: @pxlkit/core, the icon packs, the icon components,
          # then @pxlkit/ui-kit-core before the three kits built on it
          PACKAGES=(
            "packages/core"
            "packages/gamification"
            "packages/feedback"
            "packages/social"
            "packages/weather"
            "packages/ui"
            "packages/effects"
            "packages/parallax"
            "packages/vue"
            "packages/angular"
            "packages/ui-kit-core"
            "packages/ui-kit"
            "packages/ui-kit-vue"
            "packages/ui-kit-angular"
          )

          published=0
          skipped=0
          failed=0

          for pkg in "${PACKAGES[@]}"; do
            name=$(node -p "require('./$pkg/package.json').name")
            local_version=$(node -p "require('./$pkg/package.json').version")

            # Query the npm registry for the currently published version
            npm_version=$(npm view "$name" version 2>/dev/null || echo "0.0.0")

            if [ "$local_version" = "$npm_version" ]; then
              echo "⏭️  $name@$local_version — already on npm, skipping"
              skipped=$((skipped + 1))
            else
              echo "📦 $name@$local_version — new version (npm has $npm_version), publishing..."
              if npm view "$name@$local_version" version > /dev/null 2>&1; then
                echo "skip $name@$local_version (already published)"
                skipped=$((skipped + 1))
                continue
              fi
              if npm publish -w "$name" --provenance --access public; then
                echo "✅ $name@$local_version published successfully"
                published=$((published + 1))
              else
                echo "❌ $name@$local_version failed to publish"
                failed=$((failed + 1))
              fi
            fi
          done

          echo ""
          echo "📊 Summary: $published published, $skipped skipped, $failed failed"

          if [ "$failed" -gt 0 ]; then
            echo "::warning::$failed package(s) failed to publish"
            exit 1
          fi
